name: build prg from bas

permissions:
  contents: write
  pull-requests: write

on:
  pull_request:
    types: [closed]
  push:
    tags:
      - 'v*'

jobs:
  build:
    if: github.event.pull_request.merged == true || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    steps:
      - name: checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: install petcat (cached)
        run: |
          sudo cp tools/petcat /usr/local/bin/petcat
          sudo chmod +x /usr/local/bin/petcat
          echo "petcat installed"

      - name: determine bas files
        id: basfiles
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            files=$(git diff --name-only ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }} | grep '\.bas$' || true)
          else
            files=$(git ls-files '*.bas')
          fi
          echo "files=$files" >> $GITHUB_OUTPUT

      - name: build prg files
        if: ${{ steps.basfiles.outputs.files != '' }}
        run: |
          for f in ${{ steps.basfiles.outputs.files }}; do
            base=$(basename "$f" .bas)
            dir=$(dirname "$f")
            outdir="$dir/../prg_files"

            mkdir -p "$outdir"

            case "$f" in
              *-vic20.bas)       flags="-w2 --vic20" ;;
              *-vic20-8k.bas)    flags="-w2 --vic20-8k" ;;
              *-vic20-16k.bas)   flags="-w2 --vic20-16k" ;;
              *-c64.bas)         flags="-w2 --c64" ;;
              *-c128.bas)        flags="-w2 --c128" ;;
              *-mega65.bas)      flags="-w2 --mega65" ;;
              *-x16.bas)         flags="-w2 --cx16" ;;
              *-plain.bas)       flags="-w2" ;;
              *)                 flags="-w2" ;;
            esac

            echo "Building $f → $outdir/${base}"
            petcat $flags -o "$outdir/${base}" "$f"
          done

      - name: commit prg files
        if: ${{ steps.basfiles.outputs.files != '' }}
        run: |
          git config user.name "CodeMonkeyATL-github-actions"
          git config user.email "ci@users.noreply.github.com"
          git add */prg_files/* || true
          git commit -m "auto-build prg from bas" || echo "no changes to commit"
          git push || echo "nothing to push"
