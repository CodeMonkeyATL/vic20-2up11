name: build prg from bas

permissions:
  contents: write
  pull-requests: write

on:
  pull_request:
    types: [closed]
  push:
    tags:
      - 'v*'

jobs:
  build:
    if: github.event.pull_request.merged == true || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    steps:
      - name: checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          # check out the branch the PR merged into, not the detached merge ref, so the commit step can push
          ref: ${{ github.event.pull_request.base.ref || github.ref }}

      - name: install petcat (cached)
        run: |
          sudo cp tools/petcat /usr/local/bin/petcat
          sudo chmod +x /usr/local/bin/petcat
          echo "petcat installed"

      - name: determine bas files
        id: basfiles
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # skip deleted files; join with spaces since $GITHUB_OUTPUT needs a single line
            files=$(git diff --name-only --diff-filter=d ${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }} | grep '\.bas$' | tr '\n' ' ' || true)
          else
            files=$(git ls-files '*.bas' | tr '\n' ' ')
          fi
          echo "files=$files" >> $GITHUB_OUTPUT

      - name: build prg files
        if: ${{ steps.basfiles.outputs.files != '' }}
        run: |
          for f in ${{ steps.basfiles.outputs.files }}; do
            base=$(basename "$f" .bas)
            dir=$(dirname "$f")
            outdir="$dir/../prgs"

            mkdir -p "$outdir"
            case "$f" in
              *-vic20.bas)       flags="-w2 --vic20" ;;
              *-vic20-8k.bas)    flags="-w2 --vic20-8k" ;;
              *-vic20-16k.bas)   flags="-w2 --vic20-16k" ;;
              *-c64.bas)         flags="-w2 --c64" ;;
              *-c128.bas)        flags="-w2 --c128" ;;
              *-mega65.bas)      flags="-w2 --mega65" ;;
              *-x16.bas)         flags="-w2 --cx16" ;;
              *-plain.bas)       flags="-w2" ;;
              *)                 flags="-w2 -l 1001" ;;
            esac

            echo "Building $f → $outdir/${base}"
            petcat $flags -o "$outdir/${base}" "$f"
          done

      - name: commit prg files
        if: ${{ steps.basfiles.outputs.files != '' }}
        env:
          # passed through env so a PR title can't inject shell commands
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          REF_NAME: ${{ github.ref_name }}
          TARGET: ${{ github.event.pull_request.base.ref || github.event.repository.default_branch }}
          FILES: ${{ steps.basfiles.outputs.files }}
        run: |
          git config user.name "CodeMonkeyATL-github-actions"
          git config user.email "ci@users.noreply.github.com"
          git add ./prgs/* || true
          if git diff --cached --quiet; then
            echo "no changes to commit"
            exit 0
          fi

          if [ -n "$PR_NUMBER" ]; then
            subject="auto-build prg from bas for PR #$PR_NUMBER: $PR_TITLE"
          else
            subject="auto-build prg from bas for tag $REF_NAME"
          fi
          git commit -m "$subject" -m "built: $FILES"

          # HEAD is detached on tag builds, so name the branch explicitly
          git push origin "HEAD:$TARGET"
